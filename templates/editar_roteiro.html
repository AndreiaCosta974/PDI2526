{% extends 'base.html' %}
{% block title %}Editar Roteiro — GeoRota{% endblock %}

{% block content %}
<div style="max-width:560px; margin:3rem auto; padding:0 1rem;">
    <div style="background:#fff; border:1px solid var(--border); border-radius:var(--radius-lg); padding:2.2rem 2.5rem; box-shadow:var(--shadow);">

        <h1 style="font-family:var(--font-display); font-size:1.4rem; color:var(--text); margin-bottom:.4rem;">✏️ Editar Roteiro</h1>
        <p style="font-size:.85rem; color:var(--text-muted); margin-bottom:1.8rem;">Altera o nome ou as notas do teu roteiro.</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label style="font-size:.85rem; font-weight:600; color:var(--text); display:block; margin-bottom:.4rem;">Destino / Nome do Roteiro</label>
                <input type="text" name="titulo" value="{{ roteiro.titulo }}" required
                    style="width:100%; box-sizing:border-box; padding:.65rem 1rem;
                           border:1.5px solid var(--border); border-radius:var(--radius);
                           background:#f8faf9; font-family:var(--font-body); font-size:.95rem; color:var(--text);">
            </div>

            <div class="form-group" style="margin-top:1.1rem;">
                <label style="font-size:.85rem; font-weight:600; color:var(--text); display:block; margin-bottom:.4rem;">Data da viagem</label>
                <input type="date" name="data_viagem" value="{{ roteiro.data_viagem|date:'Y-m-d' }}"
                    style="width:100%; box-sizing:border-box; padding:.65rem 1rem;
                           border:1.5px solid var(--border); border-radius:var(--radius);
                           background:#f8faf9; font-family:var(--font-body); font-size:.95rem; color:var(--text);">
                <small style="color:var(--text-muted); font-size:.78rem;">Usada no contador "dias até à próxima viagem" no dashboard.</small>
            </div>

            <div class="form-group" style="margin-top:1.1rem;">
                <label style="font-size:.85rem; font-weight:600; color:var(--text); display:block; margin-bottom:.4rem;">Notas</label>
                <textarea name="descricao" rows="4" placeholder="Descreve os teus planos, dicas, notas..."
                    style="width:100%; box-sizing:border-box; padding:.65rem 1rem;
                           border:1.5px solid var(--border); border-radius:var(--radius);
                           background:#f8faf9; font-family:var(--font-body); font-size:.9rem;
                           color:var(--text); resize:vertical;">{{ roteiro.descricao }}</textarea>
            </div>

            <div class="form-group" style="margin-top:1.1rem;">
                <label style="display:flex; align-items:center; gap:.6rem; cursor:pointer; font-size:.9rem; color:var(--text);">
                    <input type="checkbox" name="publico" {% if roteiro.publico %}checked{% endif %}
                        style="width:18px; height:18px; cursor:pointer;">
                    Tornar este roteiro <strong>público</strong> (visível a outros utilizadores na página Explorar)
                </label>
            </div>

            <div style="display:flex; gap:.8rem; margin-top:1.8rem;">
                <button type="submit" class="btn-primary" style="flex:1;">Guardar Alterações</button>
                <a href="{% url 'detalhe_roteiro' roteiro.pk %}" class="btn-outline" style="flex:1; text-align:center; line-height:2.4;">Cancelar</a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
